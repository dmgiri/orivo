name: Build release packages

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/build-win.mjs
      - scripts/build-linux.mjs
      - scripts/windows-assets.mjs
      - scripts/windows-resources.ps1
      - docs/RELEASE.md
      - main.cjs
      - preload.cjs
      - host-security.cjs
      - product-*.cjs
      - trace-*.cjs
      - editor-source.cjs
      - project-map-store.cjs
      - page-runtime.cjs
      - session-navigation.cjs
      - diagram-studio.cjs
      - renderer/**
      - engine/**
      - adapters/**
      - demo/**
      - resources/**
      - vendor/**
      - .github/workflows/build-release-packages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 portable package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install dependencies
        run: npm.cmd ci
      - name: Build Windows package
        run: npm.cmd run build:win
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: Orivo-0.1.0-beta-win32-x64
          path: dist/releases/
          if-no-files-found: error

  linux:
    name: Linux x64 portable package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux package
        run: npm run build:linux
      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: Orivo-0.1.0-beta-linux-x64
          path: dist/releases/
          if-no-files-found: error
